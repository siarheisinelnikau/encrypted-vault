[package]
name = "encrypted-vault"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A password-protected encrypted Windows virtual drive"
repository = "https://github.com/siarheisinelnikau/encrypted-vault"
build = "build.rs"

[lib]
name = "encrypted_vault"

[[bin]]
name = "EncryptedVault"
path = "src/main.rs"

[dependencies]
argon2 = { path = "vendor/argon2", default-features = false, features = ["zeroize"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
fs2 = "0.4"
getrandom = "0.3"
hex = "0.4"
ring = "0.17"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = { version = "3.5", default-features = false, features = ["rustls", "json"] }
zeroize = { version = "1.9", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Security", "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
